<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>I LOVE PRIYA SO MUCH ❤️</title>
    <meta name="theme-color" content="#0a0806" />
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0806'/%3E%3Ccircle cx='16' cy='16' r='13' fill='%23131313'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%232b2b2b' stroke-width='0.8'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23232323' stroke-width='0.8'/%3E%3Ccircle cx='16' cy='16' r='4.4' fill='%23e9dcc6'/%3E%3Ccircle cx='16' cy='16' r='0.9' fill='%230a0806'/%3E%3C/svg%3E" />
    <meta name="description" content="a record, turning." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="assets/vinyl-record.png" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Crimson+Text:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet" />
    <style>
        /* ============================================================
           tokens
           ============================================================ */
        :root {
            --bg: #0a0806;
            --bg-lift: #16100b;
            --text: #d9cbb4;
            --text-soft: #b6a68e;
            --text-dim: #8b7c67;
            --accent: #c3a179;
            --warm: #e9c48f;

            --ease-soft: cubic-bezier(0.22, 0.61, 0.36, 1);
            --ease-inout: cubic-bezier(0.4, 0.05, 0.2, 1);

            /* deck geometry */
            --disc: min(70vw, 44vh, 400px);
            --tilt: 11deg;
            --arm-deg: -24;
            --arm-lift: 12px;
            --scene: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: var(--bg);
        }

        body {
            font-family: 'Cormorant Garamond', 'Crimson Text', Georgia, serif;
            color: var(--text);
            position: fixed;
            inset: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
           environment — a dim warm room, one light
           ============================================================ */
        .env {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .env-base {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(120% 85% at 50% 8%, #1b1310 0%, #120d09 42%, #0a0806 78%),
                var(--bg);
        }

        .env-texture {
            position: absolute;
            inset: -2%;
            background-image: url('assets/background-texture.jpg');
            background-size: cover;
            background-position: center 30%;
            opacity: 0.3;
            mix-blend-mode: soft-light;
            filter: saturate(0.55) contrast(1.05);
        }

        /* the lamp: warm, wide, low-saturation */
        .env-light {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(52% 38% at 50% 27%, rgba(233, 196, 143, 0.2) 0%, rgba(233, 196, 143, 0.06) 46%, transparent 72%),
                radial-gradient(85% 55% at 18% 0%, rgba(255, 226, 180, 0.085) 0%, transparent 58%),
                radial-gradient(150% 40% at 50% 66%, rgba(126, 96, 66, 0.11) 0%, transparent 62%);
            opacity: calc(0.82 * var(--scene));
            transition: opacity 2.4s var(--ease-soft);
            animation: breathe 17s var(--ease-inout) infinite;
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1) translateY(0);
            }

            50% {
                transform: scale(1.035) translateY(-0.6%);
            }
        }

        /* the surface the record rests on */
        .env-floor {
            position: absolute;
            left: -10%;
            right: -10%;
            bottom: -6%;
            height: 52%;
            background:
                linear-gradient(180deg, transparent 0%, rgba(6, 4, 3, 0.5) 55%, rgba(4, 3, 2, 0.78) 100%);
        }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 900;
            pointer-events: none;
            background:
                radial-gradient(ellipse 78% 68% at 50% 42%, transparent 42%, rgba(5, 3, 2, 0.42) 76%, rgba(3, 2, 1, 0.82) 100%);
        }

        .grain {
            position: fixed;
            inset: -50%;
            z-index: 910;
            pointer-events: none;
            opacity: 0.055;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 180px 180px;
            animation: grainShift 1.1s steps(1, end) infinite;
        }

        @keyframes grainShift {
            0% { transform: translate3d(0, 0, 0); }
            20% { transform: translate3d(-6%, 3%, 0); }
            40% { transform: translate3d(4%, -5%, 0); }
            60% { transform: translate3d(-3%, -2%, 0); }
            80% { transform: translate3d(5%, 4%, 0); }
            100% { transform: translate3d(0, 0, 0); }
        }

        /* ============================================================
           layout
           ============================================================ */
        .page {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(1.8rem, 6.5vh, 4rem);
            padding:
                calc(env(safe-area-inset-top, 0px) + 3vh) 1.5rem
                calc(env(safe-area-inset-bottom, 0px) + 3vh);
        }

        .stage {
            flex: 0 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(1.1rem, 3.4vh, 2.1rem);
            min-height: 0;
        }

        /* ============================================================
           the deck
           ============================================================ */
        .deck-outer {
            position: relative;
            width: var(--disc);
            height: var(--disc);
            /* optical centering: the tonearm reaches out to the right */
            transform: translateX(calc(var(--disc) * -0.075));
            animation: deckIn 1.9s var(--ease-soft) both;
        }

        @keyframes deckIn {
            from {
                opacity: 0;
                transform: translateX(calc(var(--disc) * -0.075)) translateY(1.4%) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateX(calc(var(--disc) * -0.075)) translateY(0) scale(1);
            }
        }

        .deck {
            position: absolute;
            inset: 0;
            /* 1em == 1% of the disc, so the whole assembly scales as one object */
            font-size: calc(var(--disc) / 100);
            transform-style: preserve-3d;
            perspective: 1400px;
            animation: sway 19s var(--ease-inout) infinite;
        }

        @keyframes sway {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-0.55%) rotate(-0.22deg);
            }
        }

        .plane {
            position: absolute;
            inset: 0;
            transform: rotateX(var(--tilt));
            transform-style: preserve-3d;
        }

        /* bloom that separates the object from the room */
        .disc-bloom {
            position: absolute;
            inset: -18%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 42%, rgba(233, 196, 143, 0.1) 0%, rgba(233, 196, 143, 0.035) 46%, transparent 68%);
            opacity: calc(0.55 + 0.45 * var(--scene));
            transition: opacity 1.6s var(--ease-soft);
            pointer-events: none;
        }

        /* contact + ambient shadow on the surface */
        .disc-shadow {
            position: absolute;
            left: 2%;
            top: 6%;
            width: 96%;
            height: 96%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.72) 58%, rgba(0, 0, 0, 0) 74%);
            filter: blur(2.2em);
            transform: translateY(3.5%) scaleY(0.94);
            pointer-events: none;
        }

        .disc-shadow::after {
            content: '';
            position: absolute;
            inset: -12%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 54%, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0.22) 55%, transparent 75%);
            filter: blur(2.6em);
        }

        /* platter rim peeking out behind the record */
        .platter {
            position: absolute;
            inset: -2%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 32%, #1d1611 0%, #120d09 58%, #0b0806 100%);
            box-shadow:
                inset 0 0.14em 0.5em rgba(255, 226, 180, 0.06),
                inset 0 -0.2em 0.6em rgba(0, 0, 0, 0.7),
                0 0.1em 0.3em rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        .record-stage {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            transform-style: preserve-3d;
            transition: transform 340ms var(--ease-soft);
        }

        .record-stage.pressed {
            transform: scale(0.986);
        }

        /* the spinning part */
        .record-spin {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            overflow: hidden;
            will-change: transform;
            backface-visibility: hidden;
        }

        /* the photographed disc only fills 87.7% of its frame —
           scaled so the real vinyl rim is the edge of the object */
        .record-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            /* The source image is already a square, centered record. Do not
               enlarge it: scaling here made the artwork's physical center
               drift relative to the HTML spindle. */
            transform: scale(1);
            filter: brightness(1.03) contrast(1.06) saturate(0.84) sepia(0.07);
        }

        /* very fine groove relief, rotates with the disc */
        .record-grooves {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                repeating-radial-gradient(circle at 50% 50%,
                    rgba(255, 240, 216, 0.022) 0 0.5px,
                    rgba(0, 0, 0, 0.05) 0.5px 2.1px);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 0 18.5%, #000 20.5% 49.2%, transparent 50%);
            mask-image: radial-gradient(circle at 50% 50%, transparent 0 18.5%, #000 20.5% 49.2%, transparent 50%);
            pointer-events: none;
        }

        /* a faint scuff so the rotation is legible even at low light */
        .record-wear {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                conic-gradient(from 200deg,
                    transparent 0deg 14deg,
                    rgba(255, 240, 216, 0.028) 22deg,
                    transparent 34deg 360deg);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 0 21%, #000 24% 48.6%, transparent 49.6%);
            mask-image: radial-gradient(circle at 50% 50%, transparent 0 21%, #000 24% 48.6%, transparent 49.6%);
            pointer-events: none;
        }

        /* — the one hidden detail, etched in the dead wax — */
        .etch {
            position: absolute;
            left: 50%;
            top: 50%;
            font-size: 2.1em;
            font-style: italic;
            font-weight: 300;
            letter-spacing: 0.4em;
            color: rgba(255, 240, 218, 0.15);
            text-shadow: 0 0.05em 0.08em rgba(0, 0, 0, 0.75);
            /* Keep the name on the label but safely outside the spindle
               opening. It rotates with the vinyl, just like a printed label. */
            transform: translate(-50%, -50%) translateY(-30%) rotate(-13deg);
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        /* static specular: light stays put while the record turns */
        .record-sheen {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                conic-gradient(from -104deg,
                    transparent 0deg,
                    rgba(255, 241, 219, 0.115) 11deg,
                    rgba(255, 241, 219, 0.02) 27deg,
                    transparent 44deg,
                    transparent 150deg,
                    rgba(255, 236, 208, 0.075) 178deg,
                    rgba(255, 236, 208, 0.015) 196deg,
                    transparent 214deg 360deg);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 0 18.5%, #000 21% 49.4%, transparent 50%);
            mask-image: radial-gradient(circle at 50% 50%, transparent 0 18.5%, #000 21% 49.4%, transparent 50%);
            opacity: calc(0.7 + 0.3 * var(--scene));
            transition: opacity 1.6s var(--ease-soft);
            pointer-events: none;
        }

        /* rim light + edge darkening so the disc has a physical edge */
        .record-edge {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow:
                inset 0 0 0 0.12em rgba(255, 233, 200, 0.07),
                inset 0 0.35em 0.9em rgba(255, 226, 180, 0.05),
                inset 0 -0.5em 1.1em rgba(0, 0, 0, 0.62);
            background:
                radial-gradient(circle at 50% 50%, transparent 47%, rgba(0, 0, 0, 0.32) 50%);
            pointer-events: none;
        }

        .spindle {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 2.2em;
            height: 2.2em;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #6d6255 0%, #2a231b 55%, #0d0a07 100%);
            box-shadow:
                0 0.12em 0.3em rgba(0, 0, 0, 0.6),
                inset 0 0 0.12em rgba(255, 240, 214, 0.25);
            pointer-events: none;
        }

        /* ============================================================
           tonearm — lives above the platter plane
           ============================================================ */
        .tonearm-assembly {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            transform: translateZ(var(--arm-lift));
            transform-style: preserve-3d;
            transition: transform 760ms var(--ease-inout);
            pointer-events: none;
        }

        .arm-pivot {
            position: absolute;
            left: 97%;
            top: -2%;
            width: 0;
            height: 0;
        }

        .arm-base {
            position: absolute;
            left: -7em;
            top: -7em;
            width: 14em;
            height: 14em;
            border-radius: 50%;
            background:
                radial-gradient(circle at 34% 28%, #3a3228 0%, #221c16 46%, #120e0a 78%, #0a0705 100%);
            box-shadow:
                0 0.5em 1.1em rgba(0, 0, 0, 0.62),
                inset 0 0.1em 0.2em rgba(255, 238, 210, 0.13);
        }

        .arm-base::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 4.6em;
            height: 4.6em;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 36% 30%, #5d5448 0%, #262019 60%, #120e07 100%);
            box-shadow: inset 0 0.08em 0.16em rgba(0, 0, 0, 0.6);
        }

        .arm {
            position: absolute;
            left: -1.35em;
            top: 0;
            width: 2.7em;
            height: 56em;
            transform-origin: 50% 0;
            transform: rotate(calc(var(--arm-deg) * 1deg));
            transition: transform 1100ms cubic-bezier(0.32, 0.72, 0, 1);
        }

        .arm-tube {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            border-radius: 1.4em;
            background:
                linear-gradient(90deg,
                    #14100c 0%,
                    #332c23 22%,
                    #6a5f4e 40%,
                    #4e4539 58%,
                    #262019 78%,
                    #100d09 100%);
            box-shadow:
                0 0.5em 1.2em rgba(0, 0, 0, 0.55),
                inset 0 0 0.1em rgba(255, 244, 224, 0.2);
        }

        .arm-counterweight {
            position: absolute;
            left: 50%;
            top: -9.5em;
            width: 6.4em;
            height: 7.4em;
            transform: translateX(-50%);
            border-radius: 1em;
            background: linear-gradient(90deg, #100d0a 0%, #332c23 42%, #4b4235 56%, #16120d 100%);
            box-shadow: 0 0.4em 0.9em rgba(0, 0, 0, 0.55);
        }

        .arm-head {
            position: absolute;
            left: 50%;
            bottom: -1.2em;
            width: 5.4em;
            height: 9.6em;
            transform: translateX(-50%) rotate(3deg);
            border-radius: 0.7em 0.7em 0.5em 0.5em;
            background: linear-gradient(100deg, #16120d 0%, #3d3529 48%, #1b1610 100%);
            box-shadow:
                0 0.5em 1em rgba(0, 0, 0, 0.55),
                inset 0 0.08em 0.16em rgba(255, 240, 214, 0.14);
        }

        .arm-head::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -2.1em;
            width: 1.1em;
            height: 2.6em;
            transform: translateX(-50%);
            border-radius: 0 0 0.3em 0.3em;
            background: linear-gradient(180deg, var(--accent) 0%, #7c6647 100%);
        }



        /* The stylus is almost motionless in reality. This tiny, irregular
           movement is deliberately subtle: enough to read as a tracking
           stylus, never enough to look like a bouncing animation. */
        .tonearm-assembly.needle-down .arm-head::after {
            animation: stylusTrack 0.115s steps(2, end) infinite;
            transform-origin: 50% 0;
        }

        @keyframes stylusTrack {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            25% { transform: translateX(calc(-50% + 0.08em)) translateY(0.018em) rotate(0.45deg); }
            50% { transform: translateX(calc(-50% - 0.05em)) translateY(-0.012em) rotate(-0.25deg); }
            75% { transform: translateX(calc(-50% + 0.03em)) translateY(0.01em) rotate(0.2deg); }
        }

        .arm-rest {
            position: absolute;
            left: 116%;
            top: 44%;
            width: 7em;
            height: 4.4em;
            transform: translate(-50%, -50%) rotate(-14deg);
            border-radius: 0.6em;
            background: linear-gradient(180deg, #251f18 0%, #120e09 100%);
            box-shadow:
                0 0.4em 0.9em rgba(0, 0, 0, 0.6),
                inset 0 0.08em 0.14em rgba(255, 238, 210, 0.1);
        }

        .arm-rest::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 4.2em;
            height: 0.7em;
            transform: translate(-50%, -50%);
            border-radius: 0.4em;
            background: linear-gradient(90deg, #453c30, #201a14);
        }

        /* soft shadow the arm casts onto the record */
        .arm-shadow {
            position: absolute;
            left: -1.6em;
            top: 1em;
            width: 3.2em;
            height: 56em;
            transform-origin: 50% 0;
            transform: rotate(calc(var(--arm-deg) * 1deg));
            transition: transform 1100ms cubic-bezier(0.32, 0.72, 0, 1);
            background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.5), transparent);
            filter: blur(0.55em);
            opacity: 0.75;
        }

        /* ============================================================
           hit areas — always above the decorative layers
           ============================================================ */
        .hit {
            position: absolute;
            appearance: none;
            -webkit-appearance: none;
            border: 0;
            background: transparent;
            padding: 0;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .hit:focus-visible {
            box-shadow: 0 0 0 1px rgba(233, 196, 143, 0.45);
        }

        .hit-record {
            left: 4%;
            top: 9%;
            width: 92%;
            height: 82%;
            border-radius: 50%;
            z-index: 30;
        }

        .hit-arm {
            left: 74%;
            top: -6%;
            width: 44%;
            height: 62%;
            min-width: 56px;
            min-height: 56px;
            border-radius: 14px;
            z-index: 40;
        }

        /* ============================================================
           slot under the deck: hint ⇄ now playing
           ============================================================ */
        .slot {
            position: relative;
            width: min(92vw, 22rem);
            height: 3.6rem;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .slot>* {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .hint {
            font-size: clamp(0.66rem, 2.9vw, 0.74rem);
            font-style: italic;
            letter-spacing: 0.22em;
            color: rgba(226, 213, 190, 0.68);
            white-space: nowrap;
            opacity: 0;
            filter: blur(3px);
            transform: translateX(-50%) translateY(5px);
            transition:
                opacity 1.5s var(--ease-soft),
                filter 1.5s var(--ease-soft),
                transform 1.5s var(--ease-soft);
            pointer-events: none;
        }

        .hint.show {
            opacity: 1;
            filter: blur(0);
            transform: translateX(-50%) translateY(0);
            animation: hintPulse 5.5s var(--ease-inout) 1.6s infinite;
        }

        @keyframes hintPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.62;
            }
        }

        .track {
            opacity: 0;
            transition: opacity 1.4s var(--ease-soft);
            pointer-events: none;
            width: 100%;
        }

        .track.show {
            opacity: 1;
        }

        .track.recede {
            opacity: 0;
        }

        .track-title {
            font-size: clamp(0.98rem, 4.2vw, 1.18rem);
            font-style: italic;
            font-weight: 300;
            letter-spacing: 0.07em;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            transition: color 1s var(--ease-soft), opacity 1s var(--ease-soft);
            opacity: 0.5;
        }

        body.playing .track-title {
            opacity: 1;
        }

        .track-line {
            position: relative;
            width: 5.2rem;
            height: 1px;
            margin: 0.62rem auto 0;
            background: rgba(226, 213, 190, 0.14);
            overflow: hidden;
        }

        .track-line span {
            position: absolute;
            inset: 0;
            transform-origin: 0 50%;
            transform: scaleX(0);
            background: linear-gradient(90deg, rgba(195, 161, 121, 0.15), rgba(233, 196, 143, 0.75));
            transition: transform 0.6s linear, opacity 1s var(--ease-soft);
            opacity: 0;
        }

        body.playing .track-line span {
            opacity: 1;
        }

        /* ============================================================
           foot: tagline, links, the quiet line
           ============================================================ */
        .foot {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(0.85rem, 2.4vh, 1.35rem);
            animation: footIn 2.4s var(--ease-soft) 0.5s both;
        }

        @keyframes footIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tagline {
            font-size: clamp(0.92rem, 3.8vw, 1.05rem);
            font-style: italic;
            font-weight: 300;
            letter-spacing: 0.09em;
            color: var(--text-soft);
            opacity: 0.88;
            text-align: center;
        }

        .links {
            display: flex;
            align-items: center;
            gap: 0;
        }

        .link {
            position: relative;
            font-size: clamp(0.74rem, 3.1vw, 0.84rem);
            letter-spacing: 0.2em;
            text-transform: lowercase;
            color: var(--text-dim);
            text-decoration: none;
            padding: 0.85rem 1rem;
            transition: color 0.55s var(--ease-soft);
            -webkit-tap-highlight-color: transparent;
        }

        .link::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0.64rem;
            width: 0;
            height: 1px;
            background: rgba(233, 196, 143, 0.5);
            transform: translateX(-50%);
            transition: width 0.55s var(--ease-soft);
        }

        .link:hover,
        .link:focus-visible,
        .link:active {
            color: var(--text);
            outline: none;
        }

        .link:hover::after,
        .link:focus-visible::after,
        .link:active::after {
            width: calc(100% - 2rem);
        }

        .links .sep {
            width: 1px;
            height: 0.62rem;
            background: rgba(226, 213, 190, 0.16);
        }

        .quiet {
            min-height: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .quiet span {
            font-size: clamp(0.6rem, 2.6vw, 0.68rem);
            font-style: italic;
            letter-spacing: 0.2em;
            color: rgba(139, 124, 103, 0.82);
            transition:
                opacity 0.85s var(--ease-soft),
                filter 0.85s var(--ease-soft),
                transform 0.85s var(--ease-soft);
            opacity: 1;
            filter: blur(0);
            transform: translateY(0);
        }

        .quiet span.out {
            opacity: 0;
            filter: blur(3px);
            transform: translateY(-4px);
        }

        audio {
            display: none;
        }

        /* ============================================================
           responsive
           ============================================================ */
        @media (min-width: 700px) and (min-height: 700px) {
            :root {
                --disc: min(40vh, 370px);
                --tilt: 12deg;
            }

            .stage {
                gap: clamp(1.4rem, 4vh, 2.4rem);
            }
        }

        @media (max-width: 430px) {
            :root {
                --disc: min(62vw, 38vh, 300px);
                --tilt: 8.5deg;
            }

            .page {
                padding-left: 1.1rem;
                padding-right: 1.1rem;
                gap: clamp(1.4rem, 4.5vh, 2.6rem);
            }

            .deck-outer {
                transform: translateX(calc(var(--disc) * -0.05));
            }

            .deck-outer {
                animation-name: deckInSmall;
            }

            .hit-arm {
                left: 70%;
                width: 52%;
            }
        }

        @keyframes deckInSmall {
            from {
                opacity: 0;
                transform: translateX(calc(var(--disc) * -0.05)) translateY(1.4%) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateX(calc(var(--disc) * -0.05)) translateY(0) scale(1);
            }
        }

        @media (max-height: 620px) {
            :root {
                --disc: min(52vw, 38vh, 260px);
                --tilt: 7deg;
            }

            .page {
                padding-top: calc(env(safe-area-inset-top, 0px) + 2.4vh);
                padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 2.2vh);
            }

            .slot {
                height: 3rem;
            }

            .foot {
                gap: 0.7rem;
            }
        }

        @media (orientation: landscape) and (max-height: 520px) {
            :root {
                --disc: min(34vh, 200px);
            }

            .tagline {
                font-size: 0.9rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .grain,
            .env-light,
            .deck {
                animation: none;
            }

            .deck-outer,
            .foot {
                animation-duration: 0.01s;
            }

            .hint.show {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <!-- environment -->
    <div class="env" aria-hidden="true">
        <div class="env-base"></div>
        <div class="env-texture"></div>
        <div class="env-light"></div>
        <div class="env-floor"></div>
    </div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="page">

        <div class="stage">

            <div class="deck-outer">
                <div class="deck">
                    <div class="plane">

                        <div class="disc-bloom" aria-hidden="true"></div>
                        <div class="disc-shadow" aria-hidden="true"></div>
                        <div class="platter" aria-hidden="true"></div>

                        <div class="record-stage" id="recordStage">
                            <div class="record-spin" id="recordSpin">
                                <img class="record-img" src="assets/vinyl-record.png" alt="" draggable="false" />
                                <div class="record-grooves"></div>
                                <div class="record-wear"></div>
                                <div class="etch" aria-hidden="true">priya</div>
                            </div>
                            <div class="record-sheen" aria-hidden="true"></div>
                            <div class="record-edge" aria-hidden="true"></div>
                            <div class="spindle" aria-hidden="true"></div>
                        </div>

                        <div class="tonearm-assembly" id="tonearmAssembly" aria-hidden="true">
                            <div class="arm-pivot">
                                <div class="arm-shadow" id="armShadow"></div>
                                <div class="arm-base"></div>
                                <div class="arm" id="arm">
                                    <div class="arm-tube"></div>
                                    <div class="arm-counterweight"></div>
                                    <div class="arm-head"></div>
                                </div>
                                <div class="arm-rest"></div>
                            </div>
                        </div>

                    </div>
                </div>

                <button class="hit hit-record" id="hitRecord" type="button" aria-pressed="false"
                    aria-label="Play or pause the record"></button>
                <button class="hit hit-arm" id="hitArm" type="button"
                    aria-label="Move the tonearm to change the song"></button>
            </div>

            <div class="slot">
                <p class="hint" id="hintRecord">tap the record</p>
                <p class="hint" id="hintArm">nudge the arm to change the song</p>
                <div class="track" id="track">
                    <div class="track-title" id="trackTitle"></div>
                    <div class="track-line"><span id="trackProgress"></span></div>
                </div>
            </div>

        </div>

        <footer class="foot">
            <p class="tagline">i write code &amp; collect music.</p>

            <nav class="links" aria-label="elsewhere">
                <a class="link" href="https://www.instagram.com/mentallyfuvkkedup/" target="_blank"
                    rel="noopener">instagram</a>
                <span class="sep" aria-hidden="true"></span>
                <a class="link"
                    href="https://open.spotify.com/user/31pzqjv3mp74qojr6jvwkcgn4lvy?si=1BXcehAPRiOA9XqIP-Pvug"
                    target="_blank" rel="noopener">spotify</a>
                <span class="sep" aria-hidden="true"></span>
                <a class="link" href="mailto:sirrvetohere@gmail.com">mail</a>
            </nav>

            <div class="quiet" aria-hidden="true"><span id="quietText">crafted slowly</span></div>
        </footer>

    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        (function () {
            'use strict';

            /* ------------------------------------------------------------
               refs
            ------------------------------------------------------------ */
            const root = document.documentElement;
            const body = document.body;
            const hitRecord = document.getElementById('hitRecord');
            const hitArm = document.getElementById('hitArm');
            const recordStage = document.getElementById('recordStage');
            const recordSpin = document.getElementById('recordSpin');
            const arm = document.getElementById('arm');
            const armShadow = document.getElementById('armShadow');
            const tonearmAssembly = document.getElementById('tonearmAssembly');
            const audioPlayer = document.getElementById('audioPlayer');
            const trackBox = document.getElementById('track');
            const trackTitle = document.getElementById('trackTitle');
            const trackProgress = document.getElementById('trackProgress');
            const hintRecordEl = document.getElementById('hintRecord');
            const hintArmEl = document.getElementById('hintArm');
            const quietText = document.getElementById('quietText');

            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            /* ------------------------------------------------------------
               state
            ------------------------------------------------------------ */
            let tracks = [];
            let currentTrackIndex = -1;
            let currentTrack = null;
            let isPlaying = false;
            let hasInteracted = false;
            let armHintShown = false;

            /* ------------------------------------------------------------
               tracks — songs/songs.json, unchanged structure
            ------------------------------------------------------------ */
            const defaultTracks = [
                { filename: 'song1.mp3', title: 'Song One' },
                { filename: 'song2.mp3', title: 'Song Two' },
                { filename: 'song3.mp3', title: 'Song Three' }
            ];

            function mapTracks(list) {
                return list.map(function (t) {
                    return { url: 'songs/' + t.filename, title: t.title };
                });
            }

            async function loadTracks() {
                try {
                    const response = await fetch('songs/songs.json');
                    if (response.ok) {
                        const data = await response.json();
                        tracks = mapTracks(data.tracks);
                    } else {
                        tracks = mapTracks(defaultTracks);
                    }
                } catch (_) {
                    tracks = mapTracks(defaultTracks);
                }
                if (tracks.length > 0) selectRandomTrack();
            }

            function setTrack(index) {
                currentTrackIndex = index;
                currentTrack = tracks[index];
                audioPlayer.src = currentTrack.url;
                trackTitle.textContent = currentTrack.title;
                setProgress(0);
                trackBox.classList.add('show');
            }

            function selectRandomTrack() {
                if (tracks.length === 0) return;
                setTrack(Math.floor(Math.random() * tracks.length));
            }

            /* ------------------------------------------------------------
               rotation — true 33⅓ RPM, with a physical-feeling ramp
            ------------------------------------------------------------ */
            // 33⅓ RPM = 200 degrees/sec = 0.2 degrees/ms.
            const RPM = 200 / 1000;
            const SPIN_UP_TAU = 760;
            const SPIN_DOWN_TAU = 980;
            let angle = Math.random() * 360;
            let velocity = 0;
            let targetVelocity = 0;
            let lastFrame = 0;
            let rafId = null;

            function applyAngle() {
                recordSpin.style.transform = 'rotate(' + angle.toFixed(3) + 'deg)';
            }

            function frame(now) {
                const dt = Math.min(now - lastFrame, 50);
                lastFrame = now;

                const tau = targetVelocity === 0 ? SPIN_DOWN_TAU : SPIN_UP_TAU;
                const blend = 1 - Math.exp(-dt / tau);
                velocity += (targetVelocity - velocity) * blend;

                // Never overshoot the commanded platter speed.
                if (targetVelocity > 0 && velocity > targetVelocity) velocity = targetVelocity;
                if (targetVelocity === 0 && velocity < 0.01) velocity = 0;

                angle = (angle + velocity * dt) % 360;
                applyAngle();

                if (targetVelocity === 0 && velocity === 0) {
                    rafId = null;
                    return;
                }
                rafId = requestAnimationFrame(frame);
            }

            function spin(on) {
                targetVelocity = on ? RPM : 0;
                if (rafId === null) {
                    lastFrame = performance.now();
                    rafId = requestAnimationFrame(frame);
                }
            }

            applyAngle();

            /* ------------------------------------------------------------
               tonearm — a real sequence: lift -> cue -> lower -> track
            ------------------------------------------------------------ */
            const ARM_PARK = -24;
            const ARM_CUE = -13;
            const ARM_DROP = 5;
            const ARM_INNER = 11.5;
            const ARM_LIFT = 26;
            const ARM_TRACK_LIFT = 16;
            const ARM_PARK_LIFT = 12;

            let armSequenceTimer = null;
            let armTrackingRAF = null;
            let armMode = 'parked';
            let queuedPlay = false;
            let armTrackingStart = 0;
            let armTrackingDuration = 0;

            function setArm(deg, lift) {
                root.style.setProperty('--arm-deg', String(deg));
                root.style.setProperty('--arm-lift', lift + 'px');
            }

            function setNeedleDown(on) {
                tonearmAssembly.classList.toggle('needle-down', !!on);
            }

            function clearArmSequence() {
                if (armSequenceTimer) {
                    clearTimeout(armSequenceTimer);
                    armSequenceTimer = null;
                }
            }

            function stopArmTracking() {
                if (armTrackingRAF !== null) {
                    cancelAnimationFrame(armTrackingRAF);
                    armTrackingRAF = null;
                }
            }

            function cueArm() {
                clearArmSequence();
                stopArmTracking();
                setNeedleDown(false);
                setArm(ARM_CUE, ARM_LIFT);
                armMode = 'cue';
            }

            function restArm() {
                clearArmSequence();
                stopArmTracking();
                setNeedleDown(false);
                setArm(ARM_PARK, ARM_PARK_LIFT);
                armMode = 'parked';
            }

            function trackArmImmediate() {
                const d = audioPlayer.duration;
                const p = (d && isFinite(d) && d > 0) ? Math.min(audioPlayer.currentTime / d, 1) : 0;
                setArm(ARM_DROP + (ARM_INNER - ARM_DROP) * p, ARM_TRACK_LIFT);
            }

            function trackArmSmooth() {
                stopArmTracking();
                if (!isPlaying || armMode !== 'playing') return;

                const d = audioPlayer.duration;
                if (!d || !isFinite(d) || d <= 0) {
                    trackArmImmediate();
                    return;
                }

                // A physical tonearm moves continuously but extremely slowly.
                // We update it per frame so it never jumps on timeupdate events.
                const p = Math.min(audioPlayer.currentTime / d, 1);
                const eased = p * p * (3 - 2 * p);
                setArm(ARM_DROP + (ARM_INNER - ARM_DROP) * eased, ARM_TRACK_LIFT);

                armTrackingRAF = requestAnimationFrame(trackArmSmooth);
            }

            function lowerNeedleAndStartAudio() {
                if (!queuedPlay || armMode !== 'cue') return;

                queuedPlay = false;
                armMode = 'lowering';
                setArm(ARM_DROP, ARM_TRACK_LIFT);

                // Let the arm visibly settle onto the lead-in groove before
                // the first audible sample is allowed to play.
                armSequenceTimer = setTimeout(function () {
                    armSequenceTimer = null;
                    if (armMode !== 'lowering') return;
                    setNeedleDown(true);
                    armMode = 'playing';

                    audioPlayer.play().then(function () {
                        onPlaying();
                        trackArmSmooth();
                    }).catch(function () {
                        restArm();
                    });
                }, 1050);
            }

            function startPlaybackSequence() {
                if (!currentTrack) return;
                clearArmSequence();
                stopArmTracking();
                queuedPlay = true;
                setNeedleDown(false);

                // The platter motor starts first and ramps naturally to 33⅓.
                // The arm is moved at the same time, but audio waits for landing.
                spin(true);
                setArm(ARM_CUE, ARM_LIFT);
                armMode = 'cue';

                armSequenceTimer = setTimeout(function () {
                    armSequenceTimer = null;
                    lowerNeedleAndStartAudio();
                }, 1250);
            }

            function pauseMechanically() {
                clearArmSequence();
                stopArmTracking();
                queuedPlay = false;
                audioPlayer.pause();
                setNeedleDown(false);
                armMode = 'paused';
                // A real pause lifts the stylus and leaves it at the groove.
                setArm(parseFloat(getComputedStyle(root).getPropertyValue('--arm-deg')) || ARM_DROP, 25);
                spin(false);
                isPlaying = false;
                body.classList.remove('playing');
                root.style.setProperty('--scene', '1');
                hitRecord.setAttribute('aria-pressed', 'false');
            }

            function resumePlaybackSequence() {
                const d = audioPlayer.duration;
                const p = (d && isFinite(d) && d > 0) ? Math.min(audioPlayer.currentTime / d, 1) : 0;
                const deg = ARM_DROP + (ARM_INNER - ARM_DROP) * p;

                setNeedleDown(false);
                setArm(deg, ARM_TRACK_LIFT + 9);
                armMode = 'lowering';
                spin(true);

                armSequenceTimer = setTimeout(function () {
                    armSequenceTimer = null;
                    setArm(deg, ARM_TRACK_LIFT);
                    setNeedleDown(true);
                    armMode = 'playing';
                    audioPlayer.play().then(function () {
                        onPlaying();
                        trackArmSmooth();
                    }).catch(function () { restArm(); });
                }, 850);
            }

            /* ------------------------------------------------------------
               playback
            ------------------------------------------------------------ */
            function onPlaying() {
                isPlaying = true;
                body.classList.add('playing');
                root.style.setProperty('--scene', '1.35');
                hitRecord.setAttribute('aria-pressed', 'true');
                trackBox.classList.add('show');
                spin(true);
                scheduleArmHint();
            }

            function onStopped() {
                pauseMechanically();
            }

            function playMusic() {
                if (!currentTrack) return;
                if (audioPlayer.currentTime > 0 && !audioPlayer.ended) resumePlaybackSequence();
                else startPlaybackSequence();
            }

            function pauseMusic() {
                pauseMechanically();
            }

            function togglePlayback() {
                firstTouch();
                if (isPlaying || armMode === 'lowering' || armMode === 'cue') {
                    pauseMusic();
                } else {
                    playMusic();
                }
            }

            function nextTrack() {
                firstTouch();
                playNextTrack();
            }

            function setProgress(p) {
                trackProgress.style.transform = 'scaleX(' + p + ')';
            }

            audioPlayer.addEventListener('timeupdate', function () {
                const d = audioPlayer.duration;
                if (d && isFinite(d) && d > 0) {
                    setProgress(Math.min(audioPlayer.currentTime / d, 1));
                }
            });

            audioPlayer.addEventListener('ended', function () {
                clearArmSequence();
                stopArmTracking();
                isPlaying = false;
                body.classList.remove('playing');
                setNeedleDown(false);
                armMode = 'cue';
                spin(false);
                cueArm();
                setTimeout(function () { playNextTrack(); }, 900);
            });

            audioPlayer.addEventListener('pause', function () {
                // The pause() call is handled explicitly by pauseMechanically.
                // Do not let the browser's pause event teleport the arm.
            });

            audioPlayer.addEventListener('error', function () { });

            /* ------------------------------------------------------------
               next track — same physical cue/land sequence
            ------------------------------------------------------------ */
            function playNextTrack() {
                if (tracks.length === 0) return;
                let next;
                do {
                    next = Math.floor(Math.random() * tracks.length);
                } while (tracks.length > 1 && next === currentTrackIndex);

                clearArmSequence();
                stopArmTracking();
                setNeedleDown(false);
                cueArm();
                setTrack(next);
                startPlaybackSequence();
            }

            /* ------------------------------------------------------------
               hints — appear quietly, then get out of the way
            ------------------------------------------------------------ */
            const SEEN_KEY = 'deck.seen';
            let seen = false;
            try { seen = localStorage.getItem(SEEN_KEY) === '1'; } catch (_) { }

            function remember() {
                try { localStorage.setItem(SEEN_KEY, '1'); } catch (_) { }
            }

            function showHint(el) {
                if (hasInteracted) return;
                trackBox.classList.add('recede');
                el.classList.add('show');
            }

            function hideHint(el) {
                el.classList.remove('show');
            }

            // first visit: the invitation arrives after the scene settles.
            // returning visit: only if nothing has been touched for a while.
            setTimeout(function () {
                if (!hasInteracted && !isPlaying) showHint(hintRecordEl);
            }, seen ? 7000 : 1800);

            function firstTouch() {
                if (hasInteracted) return;
                hasInteracted = true;
                hideHint(hintRecordEl);
                trackBox.classList.remove('recede');
                remember();
            }

            // the arm hint introduces itself once the music is going, and
            // the arm itself moves a little so the words point at something.
            let armHintTimer = null;

            function scheduleArmHint() {
                if (armHintShown || seen || armHintTimer) return;
                armHintTimer = setTimeout(function () {
                    armHintTimer = null;
                    if (!isPlaying || armHintShown) return;
                    armHintShown = true;
                    remember();
                    trackBox.classList.add('recede');
                    hintArmEl.classList.add('show');
                    nudgeArm();
                    setTimeout(function () {
                        hintArmEl.classList.remove('show');
                        trackBox.classList.remove('recede');
                    }, 6200);
                }, 5200);
            }

            function unscheduleArmHint() {
                if (armHintTimer) {
                    clearTimeout(armHintTimer);
                    armHintTimer = null;
                }
            }

            function nudgeArm() {
                if (reduceMotion) return;
                const base = parseFloat(getComputedStyle(root).getPropertyValue('--arm-deg')) || ARM_DROP;
                let n = 0;
                const beat = setInterval(function () {
                    n++;
                    setArm(n % 2 ? base - 1.6 : base, n % 2 ? 19 : 16);
                    if (n >= 4) clearInterval(beat);
                }, 900);
            }

            /* ------------------------------------------------------------
               input — pointer for feel, click for action
            ------------------------------------------------------------ */
            function press(on) {
                recordStage.classList.toggle('pressed', on);
            }

            hitRecord.addEventListener('pointerdown', function () { press(true); });
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
                hitRecord.addEventListener(ev, function () { press(false); });
            });

            hitRecord.addEventListener('click', function (e) {
                e.preventDefault();
                togglePlayback();
            });

            hitArm.addEventListener('pointerdown', function () {
                if (isPlaying) setArm(ARM_CUE, 24);
            });

            hitArm.addEventListener('click', function (e) {
                e.preventDefault();
                nextTrack();
            });

            // keep stray gestures from scrolling or selecting the scene
            document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
            document.addEventListener('contextmenu', function (e) {
                if (e.target.closest('.deck-outer')) e.preventDefault();
            });
            document.addEventListener('touchmove', function (e) {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });

            /* ------------------------------------------------------------
               the quiet line at the bottom, in many languages
            ------------------------------------------------------------ */
            const lines = [
                'crafted slowly',
                'धीरे-धीरे गढ़ा गया',
                'creado lentamente',
                'façonné lentement',
                'creato lentamente',
                'ゆっくりと作られた',
                'صُنع ببطء',
                '천천히 만들어진',
                'criado lentamente',
                'langsam gefertigt',
                'создано медленно',
                'yavaşça işlendi',
                'ধীরে ধীরে তৈরি',
                'آہستہ آہستہ تراشا گیا',
                'langzaam gemaakt',
                'skapat långsamt',
                'φτιαγμένο αργά',
                'נוצר לאט',
                'ค่อยๆ สร้างขึ้น',
                'được tạo nên chậm rãi'
            ];
            let lineIndex = 0;

            setInterval(function () {
                quietText.classList.add('out');
                setTimeout(function () {
                    lineIndex = (lineIndex + 1) % lines.length;
                    quietText.textContent = lines[lineIndex];
                    quietText.classList.remove('out');
                }, 900);
            }, 7400);

            /* ------------------------------------------------------------
               init
            ------------------------------------------------------------ */
            restArm();
            loadTracks();
        })();
    </script>

</body>
