<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121110">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="i write code & collect music.">
  <meta property="og:title" content="mentallyfuckedup">
  <meta property="og:description" content="i write code & collect music.">
  <meta property="og:type" content="website">
  <title>mentallyfuckedup</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/lora-italic.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="/assets/walnut.jpg" as="image">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <main class="stage">
    <div class="deck-fit" id="deckFit">
      <div class="deck" id="deck">

        <!-- plinth: mitred walnut frame around a recessed panel -->
        <div class="plinth" aria-hidden="true">
          <div class="panel"></div>
          <div class="frame frame--t"></div><div class="frame frame--b"></div>
          <div class="frame frame--l"></div><div class="frame frame--r"></div>
          <div class="inlay"></div>
          <div class="bevel"></div>
        </div>
        <p class="engrave" aria-hidden="true">NEERAJ</p>

        <!-- platter -->
        <div class="well" aria-hidden="true"></div>
        <div class="platter" aria-hidden="true">
          <div class="spin" id="spin">
            <div class="strobe"></div>
            <div class="record" id="record">
              <img class="grooves" src="/assets/grooves.webp" alt="" draggable="false" width="1400" height="1400">
              <div class="label"><img src="/assets/label.webp" alt="" draggable="false" width="720" height="720"></div>
            </div>
          </div>
        </div>
        <div class="sheen" aria-hidden="true"></div>
        <div class="spindle" aria-hidden="true"><i></i></div>

        <!-- tonearm base -->
        <div class="plate" aria-hidden="true"></div>
        <svg class="layer decor" id="decor" viewBox="0 0 1120 900" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f1efe8"/><stop offset=".45" stop-color="#bdb9af"/><stop offset="1" stop-color="#6f6c66"/>
            </linearGradient>
            <linearGradient id="gSteelH" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#6d6a64"/><stop offset=".3" stop-color="#e9e6de"/><stop offset=".6" stop-color="#a9a59b"/><stop offset="1" stop-color="#55534f"/>
            </linearGradient>
            <radialGradient id="gScrew" cx=".38" cy=".32" r=".8">
              <stop offset="0" stop-color="#f6f3ea"/><stop offset=".55" stop-color="#9f9b91"/><stop offset="1" stop-color="#4b4944"/>
            </radialGradient>
            <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
          </defs>
          <g id="decorStatic"></g>
          <g id="restStand"></g>
        </svg>

        <!-- tonearm (built by main.js) -->
        <svg class="layer arm-svg" id="armSvg" viewBox="0 0 1120 900" aria-hidden="true" focusable="false">
          <defs id="armDefs"></defs>
          <g id="armShadow" fill="#000" stroke="#000" opacity=".5" filter="url(#fArmBlur)"></g>
          <g id="arm"></g>
        </svg>

        <div class="housing" aria-hidden="true"><i class="housing__step"></i><i class="housing__cap"></i></div>

        <svg class="layer top-svg" id="topSvg" viewBox="0 0 1120 900" focusable="false">
          <defs>
            <linearGradient id="gLever" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b4944"/><stop offset=".35" stop-color="#f1eee6"/><stop offset=".6" stop-color="#a8a49a"/><stop offset="1" stop-color="#3d3b37"/></linearGradient>
            <linearGradient id="gBlack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2927"/><stop offset=".35" stop-color="#5a5852"/><stop offset=".6" stop-color="#1b1a18"/><stop offset="1" stop-color="#0b0b0a"/></linearGradient>
            <filter id="fLever" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4"/></filter>
          </defs>
          <g id="lever" role="button" tabindex="0" aria-label="Cue lever" aria-pressed="false">
            <g id="leverShadow" fill="#000" opacity=".45" filter="url(#fLever)"></g>
            <g id="leverBody"></g>
            <path id="leverHit" d="M1010 272L1032 352" fill="none" stroke="transparent" stroke-width="40" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          </g>
        </svg>

        <!-- pitch trim, on the arm plate -->
        <div class="dial trim" id="trim" role="slider" tabindex="0" aria-label="Speed trim" aria-valuemin="-6" aria-valuemax="6" aria-valuenow="0">
          <div class="dial__well"></div>
          <div class="dial__rotor"><i class="dial__knurl"></i><i class="dial__cap"></i><i class="dial__mark"></i></div>
        </div>

        <!-- controls -->
        <div class="lamp" id="lamp" aria-hidden="true">
          <i class="lamp__glow"></i><i class="lamp__bezel"></i><i class="lamp__lens"></i><i class="lamp__shine"></i>
        </div>

        <div class="power" id="power" role="switch" aria-checked="false" tabindex="0" aria-label="Motor">
          <svg class="power__plate" viewBox="-60 -60 120 120" aria-hidden="true" focusable="false">
            <circle cx="-37" cy="-31" r="5" fill="none" stroke="#2b2926" stroke-width="2.2"/>
            <path d="M37 -38v14" stroke="#2b2926" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
          <div class="power__rotor"><i class="power__skirt"></i><i class="power__cap"></i><i class="power__mark"></i></div>
        </div>

        <div class="knob" id="volume" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
          <svg class="knob__ticks" viewBox="-70 -70 140 140" aria-hidden="true" focusable="false" id="volTicks"></svg>
          <div class="knob__rotor"><i class="knob__knurl"></i><i class="knob__cap"></i><i class="knob__mark"></i></div>
        </div>

        <div class="platter-hit" id="platterHit" aria-label="Record"></div>
        <div class="light" aria-hidden="true"></div>
        <button class="sr-only" id="armKey" type="button">Place or lift the tonearm</button>
      </div>
    </div>

    <footer class="caption">
      <div class="now">
        <button class="skip" id="prevBtn" type="button" aria-label="Previous track">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 6.5 9 12l5.5 5.5"/></svg>
        </button>
        <div class="meta" aria-live="polite">
          <span class="title" id="title"></span>
          <span class="artist" id="artist"></span>
        </div>
        <button class="skip" id="nextBtn" type="button" aria-label="Next track">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 6.5 15 12l-5.5 5.5"/></svg>
        </button>
      </div>
      <p class="hint" id="hint"></p>
      <div class="foot">
        <p class="tagline">{ i write code &amp; collect music. }</p>
        <nav class="links" aria-label="Elsewhere">
          <a href="https://www.instagram.com/mentallyfuvkkedup/" target="_blank" rel="noopener noreferrer">instagram</a>
          <a href="https://open.spotify.com/user/31pzqjv3mp74qojr6jvwkcgn4lvy" target="_blank" rel="noopener noreferrer">spotify</a>
          <a href="mailto:sirrvetohere@gmail.com">mail</a>
        </nav>
      </div>
    </footer>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
