<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Priya — silver P monogram</title>
  <desc id="desc">A polished silver serif P decorated with icy-blue and pearl-white flowers and a crystal dragonfly on black.</desc>
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#555b62"/>
      <stop offset=".12" stop-color="#f8fbff"/>
      <stop offset=".22" stop-color="#aab0b7"/>
      <stop offset=".34" stop-color="#fff"/>
      <stop offset=".49" stop-color="#8b9198"/>
      <stop offset=".61" stop-color="#f5f7fa"/>
      <stop offset=".75" stop-color="#777e86"/>
      <stop offset=".88" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#707780"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#555961"/>
      <stop offset=".24" stop-color="#fff"/>
      <stop offset=".53" stop-color="#7c8289"/>
      <stop offset=".8" stop-color="#fff"/>
      <stop offset="1" stop-color="#6c7178"/>
    </linearGradient>
    <linearGradient id="petalBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset=".34" stop-color="#c5e7ff"/>
      <stop offset=".72" stop-color="#72b9f3"/>
      <stop offset="1" stop-color="#edfaff"/>
    </linearGradient>
    <linearGradient id="petalPearl" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".45" stop-color="#dce2e8"/>
      <stop offset=".78" stop-color="#aeb8c2"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4badd1"/>
      <stop offset=".42" stop-color="#d5faff"/>
      <stop offset=".65" stop-color="#39bfe8"/>
      <stop offset="1" stop-color="#e5ffff"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".96"/>
      <stop offset=".52" stop-color="#eaf7ff" stop-opacity=".78"/>
      <stop offset="1" stop-color="#aab9c8" stop-opacity=".8"/>
    </linearGradient>
    <radialGradient id="gem" cx="30%" cy="20%" r="80%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".38" stop-color="#d7f2ff"/>
      <stop offset=".72" stop-color="#79bce9"/>
      <stop offset="1" stop-color="#edfaff"/>
    </radialGradient>
    <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
      <feOffset dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="pearl">
      <circle r="4.1" fill="url(#petalPearl)" stroke="#fff" stroke-width=".65"/>
      <circle cx="-1.2" cy="-1.3" r="1.2" fill="#fff" opacity=".95"/>
    </g>
    <g id="blueFlower" stroke="#effaff" stroke-width=".65">
      <ellipse cy="-10.5" rx="5.8" ry="10.2" fill="url(#petalBlue)"/>
      <ellipse cy="-10.5" rx="5.8" ry="10.2" fill="url(#petalBlue)" transform="rotate(60)"/>
      <ellipse cy="-10.5" rx="5.8" ry="10.2" fill="url(#petalBlue)" transform="rotate(120)"/>
      <ellipse cy="-10.5" rx="5.8" ry="10.2" fill="url(#petalBlue)" transform="rotate(180)"/>
      <ellipse cy="-10.5" rx="5.8" ry="10.2" fill="url(#petalBlue)" transform="rotate(240)"/>
      <ellipse cy="-10.5" rx="5.8" ry="10.2" fill="url(#petalBlue)" transform="rotate(300)"/>
      <circle r="4.3" fill="url(#gem)" stroke="#fff" stroke-width=".8"/>
      <circle r="1.3" fill="#fff"/>
    </g>
    <g id="whiteFlower" stroke="#fff" stroke-width=".7">
      <ellipse cy="-9" rx="5.7" ry="8.8" fill="url(#petalPearl)"/>
      <ellipse cy="-9" rx="5.7" ry="8.8" fill="url(#petalPearl)" transform="rotate(72)"/>
      <ellipse cy="-9" rx="5.7" ry="8.8" fill="url(#petalPearl)" transform="rotate(144)"/>
      <ellipse cy="-9" rx="5.7" ry="8.8" fill="url(#petalPearl)" transform="rotate(216)"/>
      <ellipse cy="-9" rx="5.7" ry="8.8" fill="url(#petalPearl)" transform="rotate(288)"/>
      <circle r="3.8" fill="url(#gem)" stroke="#fff" stroke-width=".7"/>
      <circle r="1.1" fill="#fff"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="#000"/>

  <!-- Fine silver stems and pearl sprays, behind the monogram -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M151 351 C147 318 150 286 147 256 C144 226 151 192 169 163" stroke="#9da7b1" stroke-width="1.55"/>
    <path d="M151 333 C136 305 126 279 129 250 C131 227 137 208 147 193" stroke="#dce3eb" stroke-width="1.1"/>
    <path d="M150 292 C164 269 176 244 179 222 C182 206 180 189 177 178" stroke="#adb8c5" stroke-width="1.15"/>
    <path d="M149 315 C166 304 177 287 184 269" stroke="#d8e0e9" stroke-width="1.1"/>
    <path d="M147 255 C132 242 124 229 122 212" stroke="#c9d1dc" stroke-width="1.1"/>
    <path d="M155 284 C143 274 135 258 134 245" stroke="#e7edf4" stroke-width=".85"/>
    <path d="M159 232 C168 219 174 202 174 188" stroke="#f4f7fb" stroke-width=".8"/>
    <path d="M154 302 C159 300 166 294 169 287" stroke="#d9e2ee" stroke-width=".85"/>
  </g>
  <g fill="url(#petalBlue)" stroke="#e4f5ff" stroke-width=".6">
    <path d="M143 283 C127 278 123 263 128 252 C141 255 148 267 143 283Z"/>
    <path d="M157 302 C159 286 169 275 181 277 C180 291 170 302 157 302Z"/>
    <path d="M148 230 C134 224 130 211 136 201 C148 207 153 218 148 230Z"/>
    <path d="M162 199 C159 186 166 173 177 171 C180 184 173 196 162 199Z"/>
  </g>

  <!-- Sculpted silver serif P; the inner counter is cut out with even-odd fill -->
  <g filter="url(#shadow)">
    <path fill="url(#chrome)" fill-rule="evenodd" stroke="url(#edge)" stroke-width="1.35" stroke-linejoin="round"
      d="M105 79 L207 79 C282 79 331 118 331 179 C331 239 286 278 219 278 L202 278 L202 396 C202 415 208 422 226 426 L251 432 L116 432 L140 426 C158 422 162 415 162 396 L162 130 C162 111 150 102 131 98 L105 96 Z
         M203 100 C260 100 299 126 311 159 C325 197 304 231 282 247 C264 259 240 263 203 262 Z"/>
    <!-- reflective edge insets -->
    <path d="M112 85 L205 85 C275 85 324 121 324 178 C324 232 284 270 218 271 L195 271 L195 397 C195 417 204 425 222 428" fill="none" stroke="#fff" stroke-opacity=".78" stroke-width="1.8"/>
    <path d="M169 128 L169 396 C169 414 163 421 149 426" fill="none" stroke="#4c5259" stroke-opacity=".75" stroke-width="2.1"/>
    <path d="M209 105 C260 104 293 127 305 161 C316 193 302 224 279 240" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.5"/>
    <path d="M208 268 C246 269 273 263 292 249" fill="none" stroke="#5f656c" stroke-opacity=".75" stroke-width="1.5"/>
    <path d="M124 88 L143 91 C162 96 177 106 177 128 L177 396 C177 416 170 423 154 428" fill="none" stroke="#f8fbff" stroke-opacity=".68" stroke-width="1.25"/>
  </g>

  <!-- Branch details on top of the stem -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 347 C151 319 149 298 150 271 C151 243 151 212 169 180" stroke="#c8d4e0" stroke-width="1.25"/>
    <path d="M148 288 C133 267 130 244 138 223" stroke="#ecf3fb" stroke-width=".9"/>
    <path d="M151 267 C165 248 174 226 175 205" stroke="#dfe8f2" stroke-width=".95"/>
  </g>
  <g>
    <use href="#blueFlower" transform="translate(180 161) rotate(9) scale(1.08)" filter="url(#softGlow)"/>
    <use href="#whiteFlower" transform="translate(143 219) rotate(-12) scale(1.13)"/>
    <use href="#whiteFlower" transform="translate(202 258) rotate(13) scale(.9)"/>
    <use href="#blueFlower" transform="translate(165 292) rotate(20) scale(.42)"/>
    <use href="#pearl" transform="translate(167 132) scale(.8)"/>
    <use href="#pearl" transform="translate(159 144) scale(.72)"/>
    <use href="#pearl" transform="translate(149 156) scale(.85)"/>
    <use href="#pearl" transform="translate(138 178) scale(.78)"/>
    <use href="#pearl" transform="translate(131 196) scale(.73)"/>
    <use href="#pearl" transform="translate(137 242) scale(.7)"/>
    <use href="#pearl" transform="translate(143 258) scale(.8)"/>
    <use href="#pearl" transform="translate(154 276) scale(.65)"/>
    <use href="#pearl" transform="translate(161 239) scale(.65)"/>
    <use href="#pearl" transform="translate(171 223) scale(.8)"/>
    <use href="#pearl" transform="translate(176 207) scale(.68)"/>
    <use href="#pearl" transform="translate(178 188) scale(.72)"/>
    <use href="#pearl" transform="translate(166 311) scale(.65)"/>
    <use href="#pearl" transform="translate(157 325) scale(.6)"/>
  </g>

  <!-- Two fine chains drape from the bowl to the dragonfly -->
  <g fill="none" stroke-linecap="round">
    <path d="M278 273 C295 291 313 306 343 319" stroke="#8f969e" stroke-width="2"/>
    <path d="M278 273 C295 291 313 306 343 319" stroke="#f5f8fc" stroke-width=".72" stroke-dasharray="2.4 2.8"/>
    <path d="M320 279 C331 294 342 306 354 319" stroke="#9ba3ad" stroke-width="2"/>
    <path d="M320 279 C331 294 342 306 354 319" stroke="#fff" stroke-width=".72" stroke-dasharray="2 2.8"/>
  </g>
  <g fill="url(#petalPearl)" stroke="#fff" stroke-width=".7">
    <circle cx="290" cy="286" r="2.2"/><circle cx="300" cy="295" r="2.1"/><circle cx="311" cy="304" r="2.1"/>
    <circle cx="329" cy="290" r="2"/><circle cx="338" cy="302" r="2.1"/><circle cx="347" cy="311" r="2"/>
  </g>

  <!-- Four translucent crystal wings -->
  <g stroke="#f3fbff" stroke-width="1.35" stroke-linejoin="round">
    <path d="M354 338 C339 326 317 313 306 318 C299 322 306 337 319 347 C333 356 344 353 355 346Z" fill="url(#wing)"/>
    <path d="M358 337 C371 319 390 305 399 310 C406 314 402 328 389 341 C378 352 367 352 357 346Z" fill="url(#wing)"/>
    <path d="M354 344 C339 344 322 345 316 354 C312 362 325 370 339 370 C347 369 353 359 357 350Z" fill="url(#wing)"/>
    <path d="M359 345 C373 342 391 345 397 354 C402 362 389 369 376 369 C367 368 361 359 357 350Z" fill="url(#wing)"/>
  </g>
  <!-- delicate crystalline wing veins -->
  <g fill="none" stroke="#fff" stroke-opacity=".82" stroke-width=".75" stroke-linecap="round">
    <path d="M354 341 L309 320 M354 341 L329 350 M354 341 L320 337 M358 341 L398 312 M358 341 L386 334 M358 341 L395 356 M356 348 L319 358 M356 348 L339 366 M359 348 L391 359 M359 348 L377 367"/>
  </g>
  <!-- Gem-set body and antennae -->
  <g fill="none" stroke="url(#aqua)" stroke-width="2.2" stroke-linecap="round">
    <path d="M356 340 C354 330 351 324 348 321"/>
    <path d="M358 340 C361 329 365 324 369 322"/>
  </g>
  <g filter="url(#softGlow)">
    <path d="M356 339 C360 351 361 365 358 382 C357 390 353 397 352 403" fill="none" stroke="#46c5ed" stroke-width="5.2" stroke-linecap="round"/>
    <path d="M355 340 C358 352 359 366 356 382 C355 390 352 397 351 402" fill="none" stroke="#e0fbff" stroke-width="1.3" stroke-linecap="round"/>
    <ellipse cx="357" cy="342" rx="5.8" ry="8.8" fill="url(#aqua)" stroke="#e9fdff" stroke-width="1.1"/>
    <ellipse cx="357" cy="342" rx="2.1" ry="4.8" fill="#20b9e7"/>
    <circle cx="354" cy="328" r="3.1" fill="url(#gem)" stroke="#fff" stroke-width=".8"/>
    <circle cx="361" cy="328" r="3.1" fill="url(#gem)" stroke="#fff" stroke-width=".8"/>
    <circle cx="358" cy="354" r="3.2" fill="url(#gem)" stroke="#fff" stroke-width=".7"/>
    <circle cx="359" cy="364" r="2.8" fill="url(#gem)" stroke="#fff" stroke-width=".6"/>
    <circle cx="358" cy="374" r="2.65" fill="url(#gem)" stroke="#fff" stroke-width=".6"/>
    <circle cx="356" cy="384" r="2.55" fill="url(#gem)" stroke="#fff" stroke-width=".6"/>
    <circle cx="353" cy="394" r="2.35" fill="url(#gem)" stroke="#fff" stroke-width=".6"/>
    <path d="M349 401 L351 408 L355 402Z" fill="url(#aqua)" stroke="#fff" stroke-width=".7"/>
  </g>
  <!-- small polished glints -->
  <g fill="#fff">
    <path d="M188 137 l1.6 4.2 4.2 1.6-4.2 1.6-1.6 4.2-1.6-4.2-4.2-1.6 4.2-1.6Z" opacity=".9"/>
    <path d="M216 244 l1.2 3.1 3.1 1.2-3.1 1.2-1.2 3.1-1.2-3.1-3.1-1.2 3.1-1.2Z" opacity=".72"/>
    <circle cx="302" cy="316" r="1.3"/><circle cx="397" cy="331" r="1.25"/><circle cx="344" cy="313" r="1.4"/>
  </g>
</svg>
